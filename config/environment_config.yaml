# Environment-Specific Configuration for MLOps Pipeline

# Development Environment
dev:
  aws:
    region: us-east-1
    account_id: "PLACEHOLDER_ACCOUNT_ID"  # Will be set via AWS_ACCOUNT_ID secret
  
  s3:
    bucket_name: PLACEHOLDER_BUCKET_NAME  # Will be set via S3_BUCKET_NAME secret
    prefix: diabetes-project
  
  sagemaker:
    role: "PLACEHOLDER_SAGEMAKER_ROLE"  # Will be set via SAGEMAKER_EXECUTION_ROLE secret
    
    processing:
      instance_type: ml.t3.medium  # Smaller/cheaper for dev
      instance_count: 1
    
    training:
      instance_type: ml.m5.large  # Smaller for dev
      instance_count: 1
      use_spot_instances: true  # Save costs
    
    endpoint:
      instance_type: ml.t2.medium  # Cheapest for dev testing
      initial_instance_count: 1
    
    autoscaling:
      enabled: false  # No autoscaling in dev
    
    monitoring:
      enabled: false  # Optional monitoring in dev
      schedule_cron: "cron(0 */12 * * ? *)"  # Every 12 hours
    
    model_registry:
      # Standardized naming aligned with existing group
      model_package_group_name: mlops-diabetes-model-group-dev
      approval_status: Approved  # Auto-approve in dev
  
  evaluation:
    approval_thresholds:
      min_accuracy: 0.70  # Lower threshold for dev experimentation
      min_f1_score: 0.65
      min_roc_auc: 0.75
  
  tags:
    Environment: Development
    CostCenter: ML-Dev
    AutoShutdown: "true"

---

# Staging Environment
staging:
  aws:
    region: us-east-1
    account_id: "PLACEHOLDER_ACCOUNT_ID"  # Will be set via AWS_ACCOUNT_ID secret
  
  s3:
    bucket_name: PLACEHOLDER_BUCKET_NAME  # Will be set via S3_BUCKET_NAME secret
    prefix: diabetes-project-staging
  
  sagemaker:
    role: "PLACEHOLDER_SAGEMAKER_ROLE"  # Will be set via SAGEMAKER_EXECUTION_ROLE secret
    
    processing:
      instance_type: ml.m5.xlarge
      instance_count: 1
    
    training:
      instance_type: ml.m5.xlarge
      instance_count: 1
      use_spot_instances: true
    
    endpoint:
      instance_type: ml.m5.large  # Similar to production
      initial_instance_count: 1
    
    autoscaling:
      enabled: true
      min_capacity: 1
      max_capacity: 3  # Lower than production
      target_invocations_per_instance: 1000
    
    monitoring:
      enabled: true
      schedule_cron: "cron(0 */6 * * ? *)"  # Every 6 hours
    
    model_registry:
      model_package_group_name: mlops-diabetes-model-group-staging
      approval_status: PendingManualApproval  # Manual approval before prod
  
  evaluation:
    approval_thresholds:
      min_accuracy: 0.75  # Production-like thresholds
      min_f1_score: 0.70
      min_roc_auc: 0.80
  
  tags:
    Environment: Staging
    CostCenter: ML-Staging
    PromoteToProd: "true"

---

# Production Environment
production:
  aws:
    region: us-east-1
    account_id: "PLACEHOLDER_ACCOUNT_ID"  # Will be set via AWS_ACCOUNT_ID secret
  
  s3:
    bucket_name: PLACEHOLDER_BUCKET_NAME  # Will be set via S3_BUCKET_NAME secret
    prefix: diabetes-project-prod
  
  sagemaker:
    role: "PLACEHOLDER_SAGEMAKER_ROLE"  # Will be set via SAGEMAKER_EXECUTION_ROLE secret
    
    processing:
      instance_type: ml.m5.2xlarge  # Larger for production
      instance_count: 1
    
    training:
      instance_type: ml.m5.2xlarge
      instance_count: 2  # Distributed training option
      use_spot_instances: false  # Reliability over cost
    
    endpoint:
      instance_type: ml.m5.xlarge  # Production-grade
      initial_instance_count: 2  # High availability
    
    autoscaling:
      enabled: true
      min_capacity: 2  # Always 2 for HA
      max_capacity: 10  # Higher capacity
      target_invocations_per_instance: 1000
    
    monitoring:
      enabled: true
      schedule_cron: "cron(0 * * * ? *)"  # Hourly
      baseline_dataset_samples: 5000  # Larger baseline
    
    model_registry:
      model_package_group_name: mlops-diabetes-model-group-prod
      approval_status: PendingManualApproval  # MUST be manually approved
  
  evaluation:
    approval_thresholds:
      min_accuracy: 0.78  # Highest thresholds for production
      min_f1_score: 0.73
      min_roc_auc: 0.82
  
  # Production-specific features
  deployment:
    strategy: blue_green  # Blue/green deployment
    rollback_on_failure: true
    canary_percentage: 10  # Start with 10% traffic
    canary_interval: 300  # 5 minutes between increases
  
  alerts:
    enabled: true
    sns_topic_arn: "PLACEHOLDER_SNS_TOPIC"  # Will be set via SNS_TOPIC_ARN secret (if using alerts)
    pagerduty_integration: false
  
  tags:
    Environment: Production
    CostCenter: ML-Production
    Criticality: High
    Compliance: Required
