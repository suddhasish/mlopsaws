name: MLOps Pipeline - Diabetes Classification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      execute_pipeline:
        description: 'Execute SageMaker Pipeline'
        required: true
        default: 'true'

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.8'

jobs:
  # Job 1: Code Quality and Testing
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black
      
      - name: Code formatting check (Black)
        run: |
          black --check src/ pipelines/ tests/
      
      - name: Lint with flake8
        run: |
          flake8 src/ pipelines/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ pipelines/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job 2: Data Validation
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download and validate data
        run: |
          python src/processing/download_data.py
          echo "Data validation completed"

  # Job 3: Build and Push Docker Image (Optional)
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: diabetes-classification
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          # docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          # docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Docker build skipped (uncomment to enable)"

  # Job 4: Upload Data to S3
  upload-data:
    name: Upload Data to S3
    runs-on: ubuntu-latest
    needs: data-validation
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas
      
      - name: Download data
        run: |
          python src/processing/download_data.py
      
      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 cp data/raw/diabetes.csv s3://$S3_BUCKET/diabetes-project/data/raw/diabetes.csv

  # Job 5: Execute SageMaker Pipeline
  sagemaker-pipeline:
    name: Execute SageMaker Pipeline
    runs-on: ubuntu-latest
    needs: upload-data
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Update configuration
        env:
          SAGEMAKER_ROLE: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # Update config.yaml with secrets
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          config['aws']['account_id'] = '$AWS_ACCOUNT_ID'
          config['sagemaker']['role'] = '$SAGEMAKER_ROLE'
          config['s3']['bucket_name'] = '$S3_BUCKET'
          config['sagemaker']['training']['checkpoint_s3_uri'] = f's3://{config[\"s3\"][\"bucket_name\"]}/checkpoints'
          with open('config/config.yaml', 'w') as f:
              yaml.dump(config, f)
          "
      
      - name: Create/Update SageMaker Pipeline
        run: |
          python pipelines/training_pipeline.py --config config/config.yaml
      
      - name: Execute Pipeline
        if: github.event.inputs.execute_pipeline == 'true' || github.ref == 'refs/heads/main'
        run: |
          python pipelines/training_pipeline.py --config config/config.yaml --execute
      
      - name: Wait for pipeline completion
        run: |
          echo "Pipeline execution started. Monitor in SageMaker Console."
          # Add pipeline status checking logic here if needed

  # Job 6: Deploy Model (Manual Approval)
  deploy-model:
    name: Deploy Model to Endpoint
    runs-on: ubuntu-latest
    needs: sagemaker-pipeline
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Update configuration
        env:
          SAGEMAKER_ROLE: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          config['aws']['account_id'] = '$AWS_ACCOUNT_ID'
          config['sagemaker']['role'] = '$SAGEMAKER_ROLE'
          config['s3']['bucket_name'] = '$S3_BUCKET'
          config['sagemaker']['training']['checkpoint_s3_uri'] = f's3://{config[\"s3\"][\"bucket_name\"]}/checkpoints'
          with open('config/config.yaml', 'w') as f:
              yaml.dump(config, f)
          "
      
      - name: Deploy approved model
        run: |
          python src/deployment/deploy.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --enable-autoscaling
      
      - name: Test endpoint
        run: |
          python src/deployment/deploy.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --test

  # Job 7: Setup Model Monitoring
  setup-monitoring:
    name: Setup Model Monitoring
    runs-on: ubuntu-latest
    needs: deploy-model
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Update configuration
        env:
          SAGEMAKER_ROLE: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          config['aws']['account_id'] = '$AWS_ACCOUNT_ID'
          config['sagemaker']['role'] = '$SAGEMAKER_ROLE'
          config['s3']['bucket_name'] = '$S3_BUCKET'
          config['sagemaker']['training']['checkpoint_s3_uri'] = f's3://{config[\"s3\"][\"bucket_name\"]}/checkpoints'
          with open('config/config.yaml', 'w') as f:
              yaml.dump(config, f)
          "
      
      - name: Enable data capture
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python src/monitoring/model_monitor.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --enable-capture
      
      - name: Create monitoring baseline
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python src/monitoring/model_monitor.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --baseline-data s3://$S3_BUCKET/diabetes-project/data/train/train.csv --create-baseline
      
      - name: Create monitoring schedule
        run: |
          python src/monitoring/model_monitor.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --create-schedule

  # Job 8: Notify on completion
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [code-quality, sagemaker-pipeline]
    if: always()
    
    steps:
      - name: Send success notification
        if: ${{ success() }}
        run: |
          echo "Pipeline executed successfully!"
          # Add SNS or Slack notification here
      
      - name: Send failure notification
        if: ${{ failure() }}
        run: |
          echo "Pipeline execution failed!"
          # Add SNS or Slack notification here
