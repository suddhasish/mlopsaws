name: MLOps Pipeline - Diabetes Classification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      execute_pipeline:
        description: 'Execute SageMaker Pipeline'
        required: true
        default: 'true'

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.8'

jobs:
  # Job 1: Code Quality and Testing
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black
      
      - name: Code formatting check (Black)
        run: |
          black --check src/ pipelines/ tests/
      
      - name: Lint with flake8
        run: |
          flake8 src/ pipelines/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ pipelines/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job 2: Data Validation
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download and validate data
        run: |
          python src/processing/download_data.py
          echo "Data validation completed"

  # Job 3: Build and Push Docker Image (Optional)
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Build and tag Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: diabetes-classification
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          # docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          # docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Docker build skipped (uncomment to enable)"

  # Job 4: Upload Data to S3
  upload-data:
    name: Upload Data to S3
    runs-on: ubuntu-latest
    needs: data-validation
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas
      
      - name: Download data
        run: |
          python src/processing/download_data.py
      
      - name: Upload to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 cp data/raw/diabetes.csv s3://$S3_BUCKET/diabetes-project/data/raw/diabetes.csv --sse AES256

  # Job 5: Execute SageMaker Pipeline
  sagemaker-pipeline:
    name: Execute SageMaker Pipeline
    runs-on: ubuntu-latest
    needs: upload-data
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create/Update SageMaker Pipeline
        env:
          SAGEMAKER_EXECUTION_ROLE: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          python pipelines/training_pipeline.py --config config/config.yaml
      
      - name: Execute Pipeline
        if: github.event.inputs.execute_pipeline == 'true' || github.ref == 'refs/heads/main'
        env:
          SAGEMAKER_EXECUTION_ROLE: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -e
          echo "Executing SageMaker pipeline (wrapped)"
          # Capture stdout (and stderr) so we can parse the execution ARN
          EXEC_OUTPUT=$(python pipelines/training_pipeline.py --config config/config.yaml --execute 2>&1 || true)
          echo "$EXEC_OUTPUT"

          # Try to extract the machine-parseable execution ARN printed by the script
          EXEC_ARN=$(echo "$EXEC_OUTPUT" | sed -n 's/.*PIPELINE_EXECUTION_ARN=\(.*\)/\1/p' | tr -d '\r')
          if [ -n "$EXEC_ARN" ]; then
            echo "Captured pipeline execution ARN: $EXEC_ARN"
            echo "PIPELINE_EXECUTION_ARN=$EXEC_ARN" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not capture execution ARN from script output. Falling back to listing latest execution."
            EXEC_ARN=$(aws sagemaker list-pipeline-executions \
              --pipeline-name "diabetes-classification-pipeline" \
              --region "${{ env.AWS_REGION }}" \
              --max-results 1 \
              --query 'PipelineExecutionSummaries[0].PipelineExecutionArn' \
              --output text)
            if [ -z "$EXEC_ARN" ] || [ "$EXEC_ARN" = "None" ]; then
              echo "::error::Failed to determine pipeline execution ARN"
              exit 1
            fi
            echo "PIPELINE_EXECUTION_ARN=$EXEC_ARN" >> "$GITHUB_ENV"
          fi
      
      - name: Wait for SageMaker pipeline completion
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PIPELINE_NAME: diabetes-classification-pipeline
          CHECK_INTERVAL: '60'
          TIMEOUT_MINUTES: '90'
        run: |
          echo "Waiting for pipeline '$PIPELINE_NAME' to complete..."
          
          # Prefer the execution ARN captured from the pipeline start step
          if [ -n "$PIPELINE_EXECUTION_ARN" ] && [ "$PIPELINE_EXECUTION_ARN" != "None" ]; then
            EXEC_ARN="$PIPELINE_EXECUTION_ARN"
            echo "Using captured execution ARN from previous step: $EXEC_ARN"
          else
            echo "No captured execution ARN found in environment, falling back to listing latest execution"
            EXEC_ARN=$(aws sagemaker list-pipeline-executions \
              --pipeline-name "$PIPELINE_NAME" \
              --region "$AWS_REGION" \
              --max-results 1 \
              --query 'PipelineExecutionSummaries[0].PipelineExecutionArn' \
              --output text)
            if [ -z "$EXEC_ARN" ] || [ "$EXEC_ARN" = "None" ]; then
              echo "::error::Failed to get pipeline execution ARN"
              exit 1
            fi
          fi

          echo "Monitoring execution: $EXEC_ARN"
          
          START=$(date +%s)
          TIMEOUT=$(( TIMEOUT_MINUTES * 60 ))
          
          while true; do
            # Check the status of the SAME execution we started with
            STATUS=$(aws sagemaker describe-pipeline-execution \
              --pipeline-execution-arn "$EXEC_ARN" \
              --region "$AWS_REGION" \
              --query 'PipelineExecutionStatus' \
              --output text)
            
            echo "Current status: $STATUS (ARN: $EXEC_ARN)"
            
            if [ "$STATUS" = "Succeeded" ]; then
              echo "✅ Pipeline execution succeeded."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              echo "::error::Pipeline execution ended with status: $STATUS"
              # Get failure details
              aws sagemaker list-pipeline-execution-steps \
                --pipeline-execution-arn "$EXEC_ARN" \
                --region "$AWS_REGION" \
                --query 'PipelineExecutionSteps[?StepStatus==`Failed`].{StepName:StepName, FailureReason:FailureReason}' \
                --output json
              exit 1
            fi
            
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START ))
            if [ "$ELAPSED" -gt "$TIMEOUT" ]; then
              echo "::error::Timeout waiting for pipeline to complete after ${TIMEOUT_MINUTES} minutes."
              exit 1
            fi
            
            sleep "$CHECK_INTERVAL"
          done

  # Job 6: Deploy Model (Manual Approval)
  deploy-model:
    name: Deploy Model to Endpoint
    runs-on: ubuntu-latest
    needs: sagemaker-pipeline
    if: github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Debug Model Registry contents
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          MODEL_PACKAGE_GROUP_NAME: ${{ secrets.MODEL_PACKAGE_GROUP_NAME }}
        run: |
          if [ -z "$MODEL_PACKAGE_GROUP_NAME" ]; then echo "::error::MODEL_PACKAGE_GROUP_NAME secret is not set"; exit 1; fi
          # Persist the secret-provided group name so later steps can override it if discovery finds a non-empty group
          echo "MODEL_PACKAGE_GROUP_NAME=$MODEL_PACKAGE_GROUP_NAME" >> "$GITHUB_ENV"
          echo "Listing latest model packages in group (masked): ****"
          aws sagemaker list-model-packages \
            --model-package-group-name "$MODEL_PACKAGE_GROUP_NAME" \
            --region "$AWS_REGION" \
            --sort-by CreationTime --sort-order Descending --max-results 5 || true

      - name: Auto-resolve Model Package Group (fallback)
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          MODEL_PACKAGE_GROUP_NAME: ${{ env.MODEL_PACKAGE_GROUP_NAME }}
        run: |
          # If current group has no packages, search for any non-empty diabetes-related group and use it
          CURRENT_GROUP="${MODEL_PACKAGE_GROUP_NAME}"
          COUNT=$(aws sagemaker list-model-packages \
            --model-package-group-name "$CURRENT_GROUP" \
            --region "$AWS_REGION" \
            --max-results 1 \
            --query 'length(ModelPackageSummaryList)' \
            --output text 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "No packages found in '$CURRENT_GROUP'. Attempting discovery..."
            CANDIDATES=$(aws sagemaker list-model-package-groups \
              --region "$AWS_REGION" \
              --name-contains diabetes \
              --max-results 100 \
              --query 'ModelPackageGroupSummaryList[].ModelPackageGroupName' \
              --output text 2>/dev/null || true)
            SELECTED=""
            for NAME in $CANDIDATES; do
              C=$(aws sagemaker list-model-packages \
                --model-package-group-name "$NAME" \
                --region "$AWS_REGION" \
                --max-results 1 \
                --query 'length(ModelPackageSummaryList)' \
                --output text 2>/dev/null || echo 0)
              if [ "$C" -gt 0 ]; then
                SELECTED="$NAME"; break
              fi
            done
            if [ -n "$SELECTED" ]; then
              echo "Resolved non-empty Model Package Group: $SELECTED"
              echo "MODEL_PACKAGE_GROUP_NAME=$SELECTED" >> "$GITHUB_ENV"
            else
              echo "::warning::No non-empty Model Package Groups found (searched by name contains 'diabetes'). Deployment will fail without a model."
            fi
          fi

      - name: Confirm chosen Model Package Group
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          MODEL_PACKAGE_GROUP_NAME: ${{ env.MODEL_PACKAGE_GROUP_NAME }}
        run: |
          echo "Deploying from Model Package Group (masked): ****"
          aws sagemaker list-model-packages \
            --model-package-group-name "$MODEL_PACKAGE_GROUP_NAME" \
            --region "$AWS_REGION" \
            --sort-by CreationTime --sort-order Descending --max-results 5 || true
      
      - name: Deploy approved model
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          MODEL_PACKAGE_GROUP_NAME: ${{ env.MODEL_PACKAGE_GROUP_NAME }}
          ALLOW_UNAPPROVED_MODEL: '1'
          ENDPOINT_INSTANCE_TYPE: ml.m5.xlarge
        run: |
          if [ -z "$MODEL_PACKAGE_GROUP_NAME" ]; then echo "::error::MODEL_PACKAGE_GROUP_NAME is not set"; exit 1; fi
          echo "Using model package group: **** (masked)"
          python src/deployment/deploy.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --enable-autoscaling
      
      - name: Test endpoint
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
        run: |
          python src/deployment/deploy.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --test

  # Job 7: Setup Model Monitoring
  setup-monitoring:
    name: Setup Model Monitoring
    runs-on: ubuntu-latest
    needs: deploy-model
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Enable data capture
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python src/monitoring/model_monitor.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --enable-capture
      
      - name: Create monitoring baseline
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python src/monitoring/model_monitor.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --baseline-data s3://$S3_BUCKET/diabetes-project/data/train/train.csv --create-baseline
      
      - name: Create monitoring schedule
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_EXECUTION_ROLE }}
        run: |
          python src/monitoring/model_monitor.py --config config/config.yaml --endpoint-name diabetes-classifier-prod --create-schedule

  # Job 8: Notify on completion
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [code-quality, sagemaker-pipeline]
    if: always()
    
    steps:
      - name: Send success notification
        if: ${{ success() }}
        run: |
          echo "Pipeline executed successfully!"
          # Add SNS or Slack notification here
      
      - name: Send failure notification
        if: ${{ failure() }}
        run: |
          echo "Pipeline execution failed!"
          # Add SNS or Slack notification here
